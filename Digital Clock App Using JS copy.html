<!DOCTYPE html>
<html>

<head>
    <title>Digital Clock App</title>
</head>

<body>
    <span id="hour"></span>:
    <span id="minute"></span>:
    <span id="second"></span>
    <script>
        let h_box = document.getElementById("hour");
        let m_box = document.getElementById("minute");
        let s_box = document.getElementById("second");

        function DigiClock() {
            let h = new Date().getHours();
            let m = new Date().getMinutes();
            let s = new Date().getSeconds();

            h_box.innerHTML = (h < 10 ? "0" + h : h);
            m_box.innerHTML = (m < 10 ? "0" + m : m);
            s_box.innerHTML = (s < 10 ? "0" + s : s);

        }
        DigiClock();
        setInterval(DigiClock, 1000)

    </script>
</body>

</html>
